apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: mri-worker
spec:
  template:
    spec:
      taskCount: 1        # one task per execution == one subject
      parallelism: 1
      template:
        spec:
          timeoutSeconds: 86400   # 24h ceiling — FastSurfer runs can take many hours
          serviceAccountName: mri-worker-sa@the-brain-benchmark-project.iam.gserviceaccount.com
          containers:
            - image: us-central1-docker.pkg.dev/the-brain-benchmark-project/mri/worker:latest
              # JOB_ID and FILE_REF are NOT set here — the dispatcher (see
              # backend/dispatcher.py) supplies them per execution as
              # container env var overrides via the Cloud Run Admin API's
              # projects.locations.jobs.run.
              env:
                - name: STORAGE_BACKEND
                  value: firebase
                - name: FIREBASE_STORAGE_BUCKET
                  value: the-brain-benchmark-project.firebasestorage.app
                - name: FASTSURFER_OUTPUT_DIR
                  value: /tmp/fastsurfer_output
                - name: FREESURFER_LICENSE
                  valueFrom:
                    secretKeyRef:
                      name: freesurfer-license
                      key: license
              resources:
                limits:
                  cpu: "8"
                  memory: 16Gi
                  # Uncomment for GPU:
                  # nvidia.com/gpu: "1"
