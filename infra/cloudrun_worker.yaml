apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: mri-worker
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          timeoutSeconds: 7200   # 2 hours max per job
          serviceAccountName: mri-worker-sa@PROJECT_ID.iam.gserviceaccount.com
          containers:
            - image: REGION-docker.pkg.dev/PROJECT_ID/mri/worker:latest
              ports:
                - containerPort: 8080
              env:
                - name: STORAGE_BACKEND
                  value: firebase
                - name: FIREBASE_STORAGE_BUCKET
                  value: PROJECT_ID.appspot.com
                - name: FASTSURFER_OUTPUT_DIR
                  value: /tmp/fastsurfer_output
                - name: FREESURFER_LICENSE
                  valueFrom:
                    secretKeyRef:
                      name: freesurfer-license
                      key: license
              resources:
                limits:
                  cpu: "8"
                  memory: 16Gi
                  # Uncomment for GPU:
                  # nvidia.com/gpu: "1"
