apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mri-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: mri-api-sa@the-brain-benchmark-project.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/the-brain-benchmark-project/mri/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: STORAGE_BACKEND
              value: firebase
            - name: QUEUE_BACKEND
              value: firestore
            - name: FIREBASE_STORAGE_BUCKET
              value: the-brain-benchmark-project.firebasestorage.app
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
