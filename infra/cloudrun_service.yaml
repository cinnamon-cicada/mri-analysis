apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mri-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: mri-api-sa@the-brain-benchmark-project.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/the-brain-benchmark-project/mri/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: STORAGE_BACKEND
              value: firebase
            - name: QUEUE_BACKEND
              value: firestore
            - name: FIREBASE_STORAGE_BUCKET
              value: the-brain-benchmark-project.firebasestorage.app
            - name: GCP_PROJECT
              value: the-brain-benchmark-project
            # Firebase web config served by GET /api/firebase-config. These are
            # public browser values (safe in source), not secrets.
            - name: FIREBASE_API_KEY
              value: AIzaSyBcq_TSzinpjbnFsM_QsOl7RFNomz21-4Q
            - name: FIREBASE_AUTH_DOMAIN
              value: the-brain-benchmark-project.firebaseapp.com
            - name: FIREBASE_APP_ID
              value: "1:1023187206139:web:9c8b34a6baa1c7cfbf555e"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
