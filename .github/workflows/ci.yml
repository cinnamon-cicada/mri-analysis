name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python-checks:
    name: Tests, dependency audit, static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: pip-audit (root requirements)
        run: pip-audit -r requirements.txt

      - name: pip-audit (backend/requirements.txt — dispatcher Cloud Function)
        run: pip-audit -r backend/requirements.txt

      - name: bandit (medium severity and above)
        run: bandit -r backend -ll

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rules-tests:
    name: Firestore/Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install rules-test dependencies
        run: npm --prefix infra/rules-tests ci

      - name: Run rules tests against the Firebase emulator
        working-directory: infra
        run: firebase emulators:exec --project=mri-analysis-rules-test --only firestore,storage "npm --prefix rules-tests test"
